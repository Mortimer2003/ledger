<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收支明细</title>
<link rel="stylesheet" href="ledger.css?v=20261004-0056">

</head>
<body>
<div class="app">
  <header class="topbar">
    <!-- 第一行：看哪一年、看哪一大类，加上跟数据、跟视图都无关的全局控件。
         年份和三个主 tab（财产/收支/预算）贴在左侧固定区，搜索吃掉中间，刷新、设置收在右端 -->
    <div class="bar bar-main">
      <div class="nav">
        <div id="cmp-bar" hidden></div>
        <div class="seg view-switch" id="view-parent">
          <button type="button" data-parent="assets">财产</button>
          <button type="button" data-parent="income" class="active">收支</button>
          <button type="button" data-parent="budget">预算</button>
        </div>
      </div>
      <div class="search">
        <span class="mag">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round">
            <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>
          </svg>
        </span>
        <input id="search" type="search" autocomplete="off" placeholder="搜索明细 / 分类 / 金额…">
        <button type="button" class="clear" id="search-clear" title="清除" hidden>✕</button>
      </div>
      <div class="tools">
        <button type="button" class="icon-btn" id="btn-refresh" title="重新加载">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 8a5.5 5.5 0 0 1-9.4 3.9L2.5 10.5"/>
            <path d="M2.5 13.5v-3h3"/>
            <path d="M2.5 8a5.5 5.5 0 0 1 9.4-3.9L13.5 5.5"/>
            <path d="M13.5 2.5v3h-3"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="btn-settings" title="设置">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round">
            <path d="M2 4.5h12M2 8h12M2 11.5h12"/>
            <circle cx="5.5" cy="4.5" r="1.5" fill="var(--bg)"/>
            <circle cx="10.5" cy="8" r="1.5" fill="var(--bg)"/>
            <circle cx="6.5" cy="11.5" r="1.5" fill="var(--bg)"/>
          </svg>
        </button>
      </div>
    </div>
    <!-- 第二行：当前主 tab 下的子视图。财产挂 明细/图表，收支挂 月度/对比，预算也挂 明细/图表，
         三条只露当前主 tab 那一条；右边是这一年的读数 -->
    <div class="bar bar-sub">
      <div class="seg view-switch sub" id="view-sub">
        <button type="button" data-view="tree" class="active">月度</button>
        <button type="button" data-view="compare">对比</button>
      </div>
      <div class="seg view-switch sub" id="view-sub-assets" hidden>
        <button type="button" data-view="assets" class="active">明细</button>
        <button type="button" data-view="assetCharts">图表</button>
      </div>
      <div class="seg view-switch sub" id="view-sub-budget" hidden>
        <button type="button" data-view="budget" class="active">明细</button>
        <button type="button" data-view="budgetCharts">图表</button>
      </div>
      <!-- 视图级工具跟在当前主 tab 的子 tab 右侧：标签（只服务账本的月度视图）、说明。
           三条子 tab 只露一条、其余 display:none，所以这一个 DOM 落在三条之后，
           就正好贴住当前那条子 tab -->
      <div class="sub-actions">
        <button type="button" class="icon-btn" id="btn-tags" title="子类标签" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 7.2V2.5h4.7l6.3 6.3-4.7 4.7z"/>
            <circle cx="5.4" cy="5.4" r=".9"/>
          </svg>
        </button>
        <div class="hint-wrap" id="hint-wrap" hidden>
          <button type="button" class="icon-btn" id="btn-hint" title="说明" aria-expanded="false">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round">
              <circle cx="8" cy="8" r="6"/>
              <path d="M8 7.4v4"/>
              <circle cx="8" cy="5" r=".85" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <div class="hint-pop" id="hint-pop" hidden></div>
        </div>
      </div>
      <div class="metrics">
        <span class="count" id="count"></span>
        <div class="totals" id="totals"></div>
      </div>
    </div>
  </header>

  <div class="progress" id="progress"></div>

  <!-- 正文舞台：工具条和滚动容器叠在一起，工具条才能悬浮在内容右上角而不占一行 -->
  <div class="stage">
    <!-- 视图级工具：只对当前视图有意义的操作。标签跟着子 tab 搬去了顶栏，
         这里只剩财产那几个新增按钮 -->
    <div class="view-bar" id="view-bar" hidden>
      <span class="view-progress" id="asset-progress" hidden></span>
      <span class="view-bar-tools">
        <button type="button" class="btn primary" id="btn-asset-month" data-asset-tool="month" hidden>＋ 新增月份</button>
        <button type="button" class="btn ghost" id="btn-asset-item" data-asset-tool="item" hidden>＋ 新增资产项</button>
      </span>
    </div>

    <main class="tree" id="tree"></main>
  </div>
  <p class="empty" id="empty" hidden>还没有数据，点画廊末尾的「新建下一个月」开始记录。</p>
</div>

<div class="mask" id="setup" hidden>
  <div class="modal">
    <h2>连接 Notion</h2>
    <p class="hint">
      这个页面是公开的，令牌只存在你这台设备的浏览器里（localStorage），
      直接从浏览器发给 Notion，不经过任何第三方服务器。
    </p>
    <div class="field">
      <label for="s-token">集成令牌</label>
      <input id="s-token" type="password" autocomplete="off" placeholder="ntn_ 开头">
    </div>
    <div class="field">
      <label for="s-ds">数据源 ID</label>
      <input id="s-ds" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="s-budget">娱乐预算数据源 ID <span class="opt">可选</span></label>
      <input id="s-budget" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="s-assets">财产数据源 ID <span class="opt">可选</span></label>
      <input id="s-assets" autocomplete="off" spellcheck="false">
    </div>
    <p class="err" id="s-err" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="s-cancel" hidden>取消</button>
      <button type="button" class="btn primary" id="s-save">保存并加载</button>
    </div>
  </div>
</div>

<div class="mask" id="tags" hidden>
  <div class="modal">
    <h2>子类标签</h2>
    <p class="hint">
      标签在所有分类之间共享。改名会把原有条目一起迁到新名字；
      删除会清空这些条目的子类，条目本身保留。
    </p>
    <div class="tag-list" id="tag-list"></div>
    <p class="tag-empty" id="tag-empty" hidden>还没有子类标签，在下面新建一个。</p>
    <div class="tag-new">
      <input id="tag-new" autocomplete="off" placeholder="新标签名称">
      <button type="button" class="btn primary" id="tag-create">新建</button>
    </div>
    <p class="tag-status" id="tag-status" hidden></p>
    <p class="err" id="tag-err" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="tag-close">关闭</button>
    </div>
  </div>
</div>

<div class="mask" id="modal" hidden>
  <form class="modal" id="form">
    <h2 id="modal-title">新增一笔</h2>

    <div class="field">
      <label for="f-month">月份</label>
      <input id="f-month" list="months" autocomplete="off" placeholder="2026年09月" required>
      <datalist id="months"></datalist>
    </div>

    <div class="field">
      <label for="f-category">分类</label>
      <select id="f-category"></select>
    </div>

    <div class="field">
      <label for="f-sub">子类 <span class="opt">可选</span></label>
      <div class="sub-row">
        <select id="f-sub"></select>
        <input id="f-sub-new" autocomplete="off" placeholder="新子类名称" hidden>
      </div>
    </div>

    <div class="field">
      <label for="f-item">明细项</label>
      <input id="f-item" autocomplete="off" placeholder="如 9月工资、回家车票" required>
    </div>

    <div class="field">
      <label for="f-amount">金额</label>
      <div class="amount-row">
        <div class="seg" id="f-sign">
          <button type="button" data-sign="-1" class="active">支出</button>
          <button type="button" data-sign="1">收入</button>
        </div>
        <span class="sign-lock" id="f-sign-lock" hidden></span>
        <input id="f-amount" type="number" min="0" step="0.01" placeholder="0.00" required>
      </div>
    </div>

    <p class="saved-hint" id="saved-hint" hidden></p>

    <div class="modal-actions">
      <button type="button" class="btn ghost" id="btn-cancel">取消</button>
      <button type="submit" class="btn primary" id="btn-save">保存</button>
    </div>
  </form>
</div>

<div class="mask" id="month-mask" hidden>
  <form class="modal" id="month-form">
    <h2>新增月份账单</h2>
    <p class="hint">按模板一次建好该月的常规项，金额留空，之后再逐条填。</p>

    <div class="field">
      <label for="m-month">月份</label>
      <input id="m-month" list="months" autocomplete="off" placeholder="2026年10月" required>
    </div>

    <ul class="tpl-list" id="tpl-list"></ul>
    <p class="tpl-note" id="tpl-note" hidden></p>
    <p class="saved-hint" id="tpl-progress" hidden></p>
    <p class="err" id="month-err" hidden></p>

    <div class="modal-actions">
      <button type="button" class="btn ghost" id="month-cancel">取消</button>
      <button type="submit" class="btn primary" id="month-create">创建</button>
    </div>
  </form>
</div>

<div class="toast" id="toast">
  <span id="toast-msg"></span>
  <button type="button" id="toast-action" hidden></button>
</div>

<script src="ledger.js?v=20261004-0056"></script>

</body>
</html>
